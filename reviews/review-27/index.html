<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hallbrook &amp; Ines — Location &amp; Reviews (V2-D)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   V2-D · LOCATION + REVIEWS · "Hallbrook" · 1920 × 1080 signage
   Vertical monogram sidebar, huge address block, rotating review strip.
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0E1A17}
body{display:flex;align-items:center;justify-content:center;
  font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased}
.stage{width:1920px;height:1080px;flex:none;position:relative;overflow:hidden;transform-origin:center center;background:#0E1A17;color:#EFF3F0;display:flex}

a{color:#C8A44C;text-decoration:none}
a:hover{color:#E0BE68}
@keyframes hb-drift{0%,100%{opacity:.35}50%{opacity:.7}}

.back-link{position:fixed;top:20px;left:24px;z-index:9999;color:#fff;mix-blend-mode:difference;opacity:.85;text-decoration:none;font-size:15px;font-weight:600;transition:opacity .2s}
.back-link:hover{opacity:1}

.review-fade{transition:opacity .6s ease}
</style>
</head>
<body>
<a class="back-link" href="../../index.html">&larr; Back to menu</a>

<div class="stage">

  <div style="width:132px;flex:none;background:#C8A44C;color:#0E1A17;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:52px 0">
    <div style="font-family:'DM Sans',sans-serif;font-size:52px;line-height:1">H<span style="opacity:.55">&amp;</span>I</div>
    <div style="font-family:'DM Sans',sans-serif;font-size:22px;letter-spacing:.42em;text-transform:uppercase;writing-mode:vertical-rl;transform:rotate(180deg)">Hallbrook &amp; Ines &middot; Corporate Counsel</div>
    <div style="font-family:'DM Sans',sans-serif;font-size:20px;letter-spacing:.14em">1994</div>
  </div>

  <div style="flex:1;display:flex;flex-direction:column;min-width:0">

    <div style="flex:1;position:relative;padding:78px 96px 0;display:flex;flex-direction:column;justify-content:center;min-height:0">
      <div style="position:absolute;top:64px;right:96px;display:flex;align-items:center;gap:16px;padding:14px 30px;border:1px solid rgba(239,243,240,.22)">
        <div style="width:9px;height:9px;border-radius:50%;background:#C8A44C;animation:hb-drift 3s ease-in-out infinite"></div>
        <div style="font-family:'DM Sans',sans-serif;font-size:19px;letter-spacing:.2em;text-transform:uppercase;color:#B9C6C0">Reception open &middot; Mon&ndash;Fri 8&ndash;6</div>
      </div>

      <div style="font-family:'DM Sans',sans-serif;font-size:21px;letter-spacing:.34em;text-transform:uppercase;color:#C8A44C;margin-bottom:34px">Visit us at</div>

      <div style="display:grid;grid-template-columns:auto 1fr;column-gap:52px;row-gap:22px;align-items:baseline;border-top:1px solid rgba(239,243,240,.16);border-bottom:1px solid rgba(239,243,240,.16);padding:44px 0">
        <div style="font-family:'DM Sans',sans-serif;font-size:20px;letter-spacing:.22em;text-transform:uppercase;color:#8FA39B;padding-top:26px">Street</div>
        <div style="font-family:'DM Sans',sans-serif;font-size:104px;line-height:1;color:#FFFFFF">401 North Wabash Avenue</div>
        <div style="font-family:'DM Sans',sans-serif;font-size:20px;letter-spacing:.22em;text-transform:uppercase;color:#8FA39B;padding-top:20px">Suite</div>
        <div style="font-family:'DM Sans',sans-serif;font-size:82px;line-height:1;color:#C8A44C">Floor 27 &middot; Suite 2710</div>
        <div style="font-family:'DM Sans',sans-serif;font-size:20px;letter-spacing:.22em;text-transform:uppercase;color:#8FA39B;padding-top:20px">City</div>
        <div style="font-family:'DM Sans',sans-serif;font-size:82px;line-height:1;color:#FFFFFF">Chicago, Illinois 60611</div>
      </div>

      <div style="display:flex;gap:64px;padding-top:34px">
        <div style="display:flex;flex-direction:column;gap:7px">
          <div style="font-family:'DM Sans',sans-serif;font-size:17px;letter-spacing:.22em;text-transform:uppercase;color:#8FA39B">Reception</div>
          <div style="font-size:28px;color:#EFF3F0">(312) 555-0148</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:7px">
          <div style="font-family:'DM Sans',sans-serif;font-size:17px;letter-spacing:.22em;text-transform:uppercase;color:#8FA39B">Online</div>
          <div style="font-size:28px;color:#C8A44C">hallbrookines.com</div>
        </div>
      </div>
    </div>

    <div class="review-fade" style="flex:none;background:#132521;border-top:1px solid rgba(200,164,76,.34);padding:40px 96px 42px;display:flex;align-items:center;gap:56px">
      <div style="display:flex;flex-direction:column;gap:12px;flex:none;padding-right:56px;border-right:1px solid rgba(239,243,240,.16)">
        <div style="display:flex;align-items:center;gap:12px">
          <div style="width:38px;height:38px;flex:none;border-radius:50%;background:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#4285F4">G</div>
          <div style="font-family:'DM Sans',sans-serif;font-size:16px;letter-spacing:.2em;text-transform:uppercase;color:#8FA39B">Google</div>
        </div>
        <div style="display:flex;align-items:baseline;gap:12px">
          <div style="font-family:'DM Sans',sans-serif;font-size:52px;line-height:1">4.8</div>
          <div style="font-size:18px;color:#8FA39B">186 reviews</div>
        </div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;gap:12px;min-width:0">
        <div data-stars style="font-size:22px;color:#C8A44C;letter-spacing:.1em">★★★★★</div>
        <div data-quote style="font-family:'DM Sans',sans-serif;font-size:36px;line-height:1.28;color:#FFFFFF"></div>
      </div>
      <div style="display:flex;align-items:center;gap:14px;flex:none;padding-left:56px;border-left:1px solid rgba(239,243,240,.16)">
        <div data-initial style="width:52px;height:52px;flex:none;border-radius:50%;background:rgba(200,164,76,.14);border:1px solid rgba(200,164,76,.4);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;color:#C8A44C"></div>
        <div style="display:flex;flex-direction:column;gap:3px">
          <div data-name style="font-size:23px;font-weight:600"></div>
          <div data-meta style="font-family:'DM Sans',sans-serif;font-size:16px;color:#8FA39B"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var stage=document.querySelector('.stage');
  function fit(){stage.style.transform='scale('+Math.min(innerWidth/1920,innerHeight/1080)+')';}
  addEventListener('resize',fit);fit();

  var REVIEWS=[
    {name:"Alicia Verner",meta:"Local Guide · 2 weeks ago",rating:5,quote:"Front desk had my visitor badge waiting. The 27th-floor conference rooms are as serious as the counsel."},
    {name:"Grant Osei",meta:"Chicago · 1 month ago",rating:5,quote:"Closed a nine-figure acquisition with their team. Clear billing, no surprises, always reachable."},
    {name:"Rina Takahashi",meta:"River North · 2 months ago",rating:5,quote:"Easy to find, validated parking, and they started the meeting exactly on time. Every time."},
    {name:"Peter Mullan",meta:"Local Guide · 3 months ago",rating:4,quote:"Excellent employment-law group. The lobby security line can be slow at 9am — come a little early."}
  ];

  var starsEl=document.querySelector('[data-stars]');
  var quoteEl=document.querySelector('[data-quote]');
  var initialEl=document.querySelector('[data-initial]');
  var nameEl=document.querySelector('[data-name]');
  var metaEl=document.querySelector('[data-meta]');
  var panel=document.querySelector('.review-fade');
  var rotateSeconds=8;
  var i=0;

  function render(){
    var r=REVIEWS[i];
    starsEl.textContent='★★★★★☆☆☆☆☆'.slice(5-r.rating,10-r.rating);
    quoteEl.textContent='“'+r.quote+'”';
    initialEl.textContent=r.name.charAt(0);
    nameEl.textContent=r.name;
    metaEl.textContent=r.meta;
  }
  render();

  setInterval(function(){
    panel.style.opacity=0;
    setTimeout(function(){
      i=(i+1)%REVIEWS.length;
      render();
      panel.style.opacity=1;
    },600);
  },rotateSeconds*1000);
})();
</script>
<script src="../../assets/js/view-source.js"></script>
</body>
</html>
