<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Review Billboard — Contact Info Emphasis</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
  .back-link { position: fixed; top: 16px; left: 16px; z-index: 100; color: #fff; opacity: 0.55; text-decoration: none; font-size: 14px; font-weight: 600; }
  .back-link:hover { opacity: 1; }

  .scene {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .top {
    order: 2;
    flex: 0 0 44vh;
    position: relative;
    background: radial-gradient(circle at 85% 15%, #24399e 0%, #16225e 45%, #0d1440 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 clamp(24px, 4vw, 60px);
  }

  .top-left {
    width: clamp(600px, 71.2vw, 1180px);
    display: flex;
    align-items: center;
    gap: clamp(20px, 2.6vw, 40px);
  }

  .avatar {
    width: clamp(90px, 16.7vh, 144px);
    height: clamp(90px, 16.7vh, 144px);
    border-radius: 50%;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .avatar svg { width: 46%; height: 46%; fill: rgba(255, 255, 255, 0.7); }

  .review-body { max-width: 56vw; }

  .rating-row { display: flex; align-items: center; gap: clamp(12px, 1.6vw, 24px); }
  .stars { font-size: clamp(18px, 2.6vh, 28px); letter-spacing: clamp(2px, 0.4vh, 4px); color: #FFB800; }
  .name { font-size: clamp(16px, 2.2vh, 24px); font-weight: 700; color: #fff; }

  .quote {
    margin-top: clamp(10px, 1.5vh, 16px);
    font-size: clamp(19px, 2.8vh, 30px);
    line-height: 1.4;
    font-weight: 600;
    color: #fff;
    text-wrap: pretty;
  }

  .bottom {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #0a0e2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(36px, 6vh, 64px);
    padding: clamp(24px, 4vh, 48px) clamp(24px, 4vw, 60px);
  }

  .bottom-orb {
    position: absolute;
    z-index: 0;
    border-radius: 50%;
    filter: blur(70px);
    pointer-events: none;
  }

  .bottom-orb--1 {
    width: 26vw;
    height: 26vw;
    top: -8%;
    left: -6%;
    background: radial-gradient(circle, rgba(241, 128, 41, 0.4) 0%, rgba(241, 128, 41, 0) 70%);
    animation: bottom-orb-float-1 20s ease-in-out infinite alternate;
  }

  .bottom-orb--2 {
    width: 24vw;
    height: 24vw;
    bottom: -12%;
    right: -5%;
    background: radial-gradient(circle, rgba(160, 5, 88, 0.4) 0%, rgba(160, 5, 88, 0) 70%);
    animation: bottom-orb-float-2 24s ease-in-out infinite alternate;
  }

  .bottom-orb--3 {
    width: 18vw;
    height: 18vw;
    top: 30%;
    left: 45%;
    background: radial-gradient(circle, rgba(80, 130, 255, 0.3) 0%, rgba(80, 130, 255, 0) 70%);
    animation: bottom-orb-float-3 17s ease-in-out infinite alternate;
  }

  @keyframes bottom-orb-float-1 {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(5vw, 4vh) scale(1.12); }
  }
  @keyframes bottom-orb-float-2 {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(-4vw, -5vh) scale(1.15); }
  }
  @keyframes bottom-orb-float-3 {
    0% { transform: translate(0, 0) scale(1); opacity: 0.7; }
    100% { transform: translate(-3vw, 3vh) scale(0.9); opacity: 1; }
  }

  .bottom-logo {
    position: relative;
    z-index: 1;
    height: clamp(28px, 4.3vh, 46px);
    width: auto;
  }

  .cards-row {
    position: relative;
    z-index: 1;
    width: clamp(600px, 71.2vw, 1180px);
    margin: 0 auto;
    display: flex;
    align-items: stretch;
    justify-content: flex-start;
    gap: clamp(20px, 2.6vw, 36px);
  }

  .contact-card {
    position: relative;
    overflow: hidden;
    flex: 1;
    max-width: 22vw;
    min-height: clamp(220px, 32vh, 340px);
    background: #12173f;
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: clamp(14px, 2vh, 22px);
    padding: clamp(46px, 7vh, 76px) clamp(20px, 2.3vw, 30px) clamp(22px, 3.3vh, 36px);
    display: flex;
    flex-direction: column;
  }

  .contact-card::after {
    content: "";
    position: absolute;
    bottom: -30%;
    left: -20%;
    width: 60%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: var(--accent, #F18029);
    opacity: 0.45;
  }

  .icon-box {
    position: relative;
    z-index: 1;
    width: clamp(44px, 6.7vh, 58px);
    height: clamp(44px, 6.7vh, 58px);
    border-radius: clamp(10px, 1.5vh, 14px);
    background: rgba(255, 255, 255, 0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .icon-box svg { width: 48%; height: 48%; }

  .contact-label {
    position: relative;
    z-index: 1;
    margin-top: clamp(16px, 2.6vh, 28px);
    font-size: clamp(11px, 1.5vh, 15px);
    font-weight: 700;
    letter-spacing: 2px;
    color: rgba(255, 255, 255, 0.5);
    text-transform: uppercase;
  }

  .contact-value {
    position: relative;
    z-index: 1;
    margin-top: clamp(6px, 1vh, 10px);
    font-size: clamp(17px, 2.4vh, 26px);
    font-weight: 800;
    color: #fff;
    line-height: 1.3;
  }
</style>
</head>
<body>
<a class="back-link" href="../../index.html">&larr; Back to menu</a>
<main class="scene">
  <div class="top">
    <div class="top-left">
      <div class="avatar">
        <svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.4 0-8 2.2-8 5v3h16v-3c0-2.8-3.6-5-8-5Z"/></svg>
      </div>
      <div class="review-body">
        <div class="rating-row">
          <div class="stars">&starf;&starf;&starf;&starf;&starf;</div>
          <div class="name">Sarah Johnson</div>
        </div>
        <div class="quote">&ldquo;Absolutely wonderful experience! The service was exceptional and the atmosphere was perfect.&rdquo;</div>
      </div>
    </div>
  </div>

  <div class="bottom">
    <div class="bottom-orb bottom-orb--1"></div>
    <div class="bottom-orb bottom-orb--2"></div>
    <div class="bottom-orb bottom-orb--3"></div>
    <img class="bottom-logo" src="../../assets/img/NTV_logo_gradient_horz_.png" alt="NTV 360" />

    <div class="cards-row">
      <div class="contact-card" style="--accent:#F18029;">
        <div class="icon-box">
          <svg viewBox="0 0 24 24" fill="#F18029"><path d="M12 2C7.6 2 4 5.6 4 10c0 5.4 8 12 8 12s8-6.6 8-12c0-4.4-3.6-8-8-8Zm0 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6Z"/></svg>
        </div>
        <div class="contact-label">Visit Us</div>
        <div class="contact-value">123 Main Street<br>City, State 12345</div>
      </div>

      <div class="contact-card" style="--accent:#A00558;">
        <div class="icon-box">
          <svg viewBox="0 0 24 24" fill="#A00558"><path d="M6.6 10.8c1.4 2.7 3.6 4.9 6.4 6.4l2.1-2.1c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.5.6.5 0 1 .4 1 1V20c0 .5-.5 1-1 1C10.5 21 3 13.5 3 4c0-.5.4-1 1-1h3.5c.6 0 1 .5 1 1 0 1.2.2 2.4.6 3.5.1.3 0 .7-.2 1l-2.3 2.3Z"/></svg>
        </div>
        <div class="contact-label">Call Us</div>
        <div class="contact-value">(555) 123-4567</div>
      </div>

      <div class="contact-card" style="--accent:#F18029;">
        <div class="icon-box">
          <svg viewBox="0 0 24 24" fill="#F18029"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm7.9 9h-3.2c-.1-2-.6-3.8-1.3-5.3A8 8 0 0 1 19.9 11ZM12 4c.9 1.3 1.6 3.4 1.7 7h-3.4c.1-3.6.8-5.7 1.7-7Zm-2.4.7C8.9 6.2 8.4 8 8.3 10H5.1a8 8 0 0 1 4.5-5.3ZM5.1 13h3.2c.1 2 .6 3.8 1.3 5.3A8 8 0 0 1 5.1 13Zm4.9 6.6c-.9-1.3-1.6-3.4-1.7-7h3.4c-.1 3.6-.8 5.7-1.7 7Zm2.4-.7c.7-1.5 1.2-3.3 1.3-5.3h3.2a8 8 0 0 1-4.5 5.3Z"/></svg>
        </div>
        <div class="contact-label">Online</div>
        <div class="contact-value">www.yourbusiness.com</div>
      </div>
    </div>
  </div>
</main>
<script src="../../assets/js/view-source.js"></script>
</body>
</html>
