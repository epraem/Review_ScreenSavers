<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Review Billboard - Signal</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet" />
<style>
  :root {
    --navy: #00263E;
    --navy-deep: #001320;
    --berry: #A00558;
    --red: #EF060F;
    --orange: #F18029;
    --gray: #8B96A0;
    --gray-light: #CCCCCC;
    --paper: #FDFDFD;
    --spectrum: linear-gradient(100deg, var(--berry) 0%, var(--red) 52%, var(--orange) 100%);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
    background: var(--navy-deep);
  }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }

  .back-link {
    position: fixed;
    top: 18px;
    left: 20px;
    z-index: 100;
    color: var(--paper);
    opacity: 0.4;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    transition: opacity 0.2s ease;
  }
  .back-link:hover { opacity: 1; }

  /* ============ technical / blueprint scene ============ */
  .scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    display: grid;
    grid-template-rows: auto 1fr;
    background: var(--navy-deep);
  }

  .blueprint {
    position: absolute;
    inset: 0;
    z-index: 0;
    background-image:
      linear-gradient(rgba(253,253,253,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(253,253,253,.05) 1px, transparent 1px);
    background-size: 64px 64px;
    pointer-events: none;
  }

  .glow {
    position: absolute;
    top: -10%;
    right: -6%;
    width: 46vw;
    height: 46vw;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(241,128,41,.14) 0%, rgba(241,128,41,0) 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* radar-style scan line, single motivated ambient motion */
  .scanline {
    position: absolute;
    left: 0;
    right: 0;
    height: 1px;
    z-index: 1;
    background: linear-gradient(90deg, transparent, rgba(241,128,41,.85), transparent);
    box-shadow: 0 0 16px 2px rgba(241,128,41,.4);
    animation: scan 8s linear infinite;
    pointer-events: none;
  }
  @keyframes scan {
    0% { top: -2%; opacity: 0; }
    5% { opacity: 1; }
    95% { opacity: 1; }
    100% { top: 102%; opacity: 0; }
  }

  /* corner registration marks */
  .reg {
    position: absolute;
    width: 32px;
    height: 32px;
    z-index: 2;
    pointer-events: none;
    opacity: .5;
  }
  .reg::before, .reg::after { content: ""; position: absolute; background: var(--gray-light); }
  .reg::before { width: 100%; height: 1.5px; top: 50%; }
  .reg::after { width: 1.5px; height: 100%; left: 50%; }
  .reg--tl { top: 28px; left: 28px; }
  .reg--tr { top: 28px; right: 28px; }
  .reg--bl { bottom: 28px; left: 28px; }
  .reg--br { bottom: 28px; right: 28px; }

  /* ---- header ---- */
  .header {
    grid-row: 1;
    position: relative;
    z-index: 4;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: clamp(24px, 3.6vh, 40px) clamp(40px, 5vw, 92px) 0;
    opacity: 0;
    animation: rise-in .7s cubic-bezier(.22,1,.36,1) .1s forwards;
  }
  .brand-logo { height: clamp(36px, 5.4vh, 56px); width: auto; display: block; }

  .source-label {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    font-size: clamp(16px, 2vh, 21px);
    font-weight: 500;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--gray);
  }
  .source-label svg { width: 24px; height: 24px; flex-shrink: 0; }

  /* ---- main: quote column + contact card, side by side ---- */
  .main-row {
    grid-row: 2;
    position: relative;
    z-index: 4;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: clamp(32px, 5vw, 80px);
    flex-wrap: wrap;
    padding: clamp(10px, 2vh, 20px) clamp(40px, 5vw, 92px);
  }

  .hero {
    flex: 1 1 480px;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: clamp(26px, 3.6vh, 44px);
  }

  .eyebrow {
    font-size: clamp(17px, 2.1vh, 23px);
    font-weight: 500;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--orange);
    opacity: 0;
    animation: rise-in .6s cubic-bezier(.22,1,.36,1) .25s forwards;
  }

  .quote {
    margin: 0;
    max-width: 15ch;
    font-weight: 800;
    font-size: clamp(50px, 9.4vh, 116px);
    line-height: 1.05;
    letter-spacing: -0.03em;
    color: var(--paper);
    opacity: 0;
    transform: translateY(16px);
    animation: rise-in .85s cubic-bezier(.22,1,.36,1) .4s forwards;
  }
  .quote em {
    font-style: italic;
    font-weight: 600;
    background: var(--spectrum);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .readout-row {
    display: flex;
    align-items: center;
    gap: clamp(28px, 3.2vw, 48px);
    flex-wrap: wrap;
    opacity: 0;
    animation: rise-in .7s cubic-bezier(.22,1,.36,1) .85s forwards;
  }

  .readout {
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  .readout-value {
    font-weight: 700;
    font-size: clamp(38px, 5.2vh, 54px);
    color: var(--paper);
    letter-spacing: -0.01em;
  }
  .readout-max { font-size: clamp(18px, 2.3vh, 24px); color: var(--gray); font-weight: 500; }

  .bars { display: flex; align-items: flex-end; gap: 7px; }
  .bars span {
    width: 10px;
    border-radius: 2px;
    background: var(--spectrum);
  }
  .bars span:nth-child(1) { height: 18px; }
  .bars span:nth-child(2) { height: 26px; }
  .bars span:nth-child(3) { height: 34px; }
  .bars span:nth-child(4) { height: 42px; }
  .bars span:nth-child(5) { height: 50px; opacity: .55; }

  .divider-v { width: 1px; height: 40px; background: rgba(253,253,253,.16); }

  .reviewer {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: clamp(19px, 2.3vh, 25px);
    font-weight: 600;
    color: var(--gray-light);
  }
  .reviewer .avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    overflow: hidden;
    background: rgba(253,253,253,.08);
    border: 1.5px solid rgba(253,253,253,.24);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    font-weight: 700;
    color: var(--paper);
  }
  .reviewer .avatar img { width: 100%; height: 100%; object-fit: cover; }

  .review-count {
    font-size: clamp(17px, 2.1vh, 22px);
    font-weight: 500;
    color: var(--gray-light);
  }

  /* ---- contact card ---- */
  .contact-card {
    flex: 0 0 clamp(340px, 30vw, 440px);
    position: relative;
    border-radius: 24px;
    background: rgba(253,253,253,.035);
    border: 1px solid rgba(253,253,253,.12);
    padding: clamp(28px, 3.8vh, 40px) clamp(30px, 3.2vw, 40px);
    opacity: 0;
    animation: rise-in .8s cubic-bezier(.22,1,.36,1) 1.05s forwards;
  }
  .contact-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    border-radius: 24px 24px 0 0;
    background: var(--spectrum);
  }

  .contact-label {
    font-size: clamp(14px, 1.6vh, 16.5px);
    font-weight: 500;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--gray);
    margin-bottom: clamp(20px, 2.6vh, 26px);
  }

  .contact-list { display: flex; flex-direction: column; }

  .contact-row {
    display: flex;
    align-items: center;
    gap: clamp(16px, 1.9vw, 22px);
    padding: clamp(18px, 2.2vh, 24px) 0;
  }
  .contact-row + .contact-row { border-top: 1px solid rgba(253,253,253,.09); }

  .contact-icon {
    flex: none;
    width: clamp(48px, 5.8vh, 58px);
    height: clamp(48px, 5.8vh, 58px);
    border-radius: 14px;
    background: rgba(241,128,41,.12);
    border: 1px solid rgba(241,128,41,.28);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .contact-icon svg { width: 46%; height: 46%; stroke: var(--orange); fill: none; }

  .contact-text { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .contact-text-label {
    font-size: clamp(12px, 1.35vh, 14px);
    font-weight: 500;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--gray);
  }
  .contact-text-value {
    font-size: clamp(18px, 2.1vh, 22px);
    font-weight: 600;
    color: var(--paper);
    line-height: 1.3;
  }

  @keyframes rise-in {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .header, .eyebrow, .quote, .readout-row, .contact-card { animation: none !important; opacity: 1 !important; transform: none !important; }
    .scanline { animation: none !important; opacity: 0 !important; }
  }

  @media (max-width: 900px) {
    .main-row { flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .hero { align-items: center; }
    .quote { max-width: 18ch; }
    .readout-row { justify-content: center; }
    .contact-card { width: 100%; max-width: 420px; }
  }
</style>
</head>
<body>
<a class="back-link" href="../../index.html">&larr; Back to menu</a>

<main class="scene">
  <div class="blueprint"></div>
  <div class="glow"></div>
  <div class="scanline"></div>
  <span class="reg reg--tl"></span>
  <span class="reg reg--tr"></span>

    <span class="source-label mono">

      <div class="contact-label mono">Get in touch</div>
      <div class="contact-list">
        <div class="contact-row">
          <span class="contact-icon">
            <svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10.5c0 5.5-8 12-8 12s-8-6.5-8-12a8 8 0 1 1 16 0Z"></path><circle cx="12" cy="10.3" r="2.8"></circle></svg>

          </span>

        </div>
        <div class="contact-row">
          <span class="contact-icon">

            <span class="contact-text-value">www.yourbusiness.com</span>
          </span>
        </div>
      </div>
    </aside>
  </div>
</main>
