<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Review Billboard - Arch</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --navy: #00263E;
    --berry: #A00558;
    --red: #EF060F;
    --orange: #F18029;
    --ink: #231F20;
    --gray: #898C8D;
    --gray-light: #CCCCCC;
    --paper: #FDFDFD;
    --spectrum: linear-gradient(100deg, var(--berry) 0%, var(--red) 52%, var(--orange) 100%);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
    background: var(--paper);
    color: var(--ink);
  }
  .serif { font-family: 'Cormorant Garamond', serif; }

  .back-link {
    position: fixed;
    top: 18px;
    left: 20px;
    z-index: 100;
    color: var(--ink);
    opacity: 0.4;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    transition: opacity 0.2s ease;
  }
  .back-link:hover { opacity: 1; }

  /* ============ clean editorial scene ============ */
  .scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    display: grid;
    grid-template-rows: auto 1fr;
    background: var(--paper);
  }

  /* ---- header: wordmark + rating chip, thin hairline below ---- */
  .header {
    grid-row: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: clamp(20px, 2.8vh, 30px) clamp(36px, 4.6vw, 84px);
    border-bottom: 1px solid rgba(35,31,32,.1);
    opacity: 0;
    animation: rise-in .7s cubic-bezier(.22,1,.36,1) .1s forwards;
  }
  .brand-logo { height: clamp(40px, 5.6vh, 56px); width: auto; display: block; }

  .rating-chip {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    padding: 14px 26px;
    border-radius: 999px;
    border: 1.5px solid rgba(35,31,32,.16);
  }
  .rating-chip svg { width: 26px; height: 26px; flex-shrink: 0; }
  .rating-chip span {
    font-size: clamp(19px, 2.3vh, 24px);
    font-weight: 600;
    letter-spacing: .02em;
    color: var(--ink);
  }
  .rating-chip strong { color: var(--orange); font-weight: 700; }

  /* ---- hero: tagline / arch photo / tagline ---- */
  .hero {
    grid-row: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(28px, 5vw, 90px);
    padding: clamp(10px, 1.6vh, 18px) clamp(36px, 4.6vw, 84px);
  }

  .tagline {
    flex: 1 1 420px;
    max-width: 30ch;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: clamp(18px, 2.4vh, 26px);
    opacity: 0;
    animation: rise-in .8s cubic-bezier(.22,1,.36,1) .35s forwards;
  }
  .tagline--right { animation-delay: .5s; }

  .tagline-quote {
    margin: 0;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-style: normal;
    font-weight: 600;
    font-size: clamp(30px, 4.6vh, 50px);
    line-height: 1.34;
    letter-spacing: -0.01em;
    color: var(--ink);
  }

  .tagline-stars { display: flex; gap: 8px; }
  .tagline-stars svg { width: clamp(24px, 3.2vh, 32px); height: clamp(24px, 3.2vh, 32px); fill: var(--orange); }

  .tagline-name {
    font-size: clamp(20px, 2.5vh, 26px);
    font-weight: 600;
    letter-spacing: .03em;
    color: var(--gray);
  }

  .tagline--right {
    align-items: flex-start;
    text-align: left;
  }

  .tagline-contact {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: clamp(20px, 2.8vh, 28px);
  }
  .contact-item {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    font-size: clamp(24px, 3.2vh, 32px);
    font-weight: 600;
    color: var(--ink);
    text-align: left;
  }
  .contact-item svg { width: 28px; height: 28px; flex-shrink: 0; stroke: var(--orange); fill: none; margin-top: 4px; }

  .arch-col {
    flex: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(18px, 2.4vh, 26px);
    opacity: 0;
    animation: rise-in .9s cubic-bezier(.22,1,.36,1) .2s forwards;
  }

  .arch {
    width: clamp(260px, 25vw, 340px);
    height: clamp(340px, 46vh, 480px);
    border-top-left-radius: clamp(130px, 12.5vw, 170px);
    border-top-right-radius: clamp(130px, 12.5vw, 170px);
    overflow: hidden;
    background: var(--navy);
    box-shadow: 0 30px 60px -30px rgba(35,31,32,.35);
  }
  .arch img { width: 100%; height: 100%; object-fit: cover; }

  .pill-btn {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    padding: 18px 40px;
    border-radius: 999px;
    border: 1.5px solid rgba(35,31,32,.28);
    font-size: clamp(16px, 1.9vh, 19px);
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink);
  }
  .pill-btn svg { width: 22px; height: 22px; flex-shrink: 0; }

  @keyframes rise-in {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .header, .tagline, .arch-col { animation: none !important; opacity: 1 !important; transform: none !important; }
  }

  @media (max-width: 860px) {
    .hero { flex-direction: column; gap: clamp(28px, 3.6vh, 40px); }
    .tagline { max-width: 36ch; }
  }
</style>
</head>
<body>
<a class="back-link" href="../../index.html">&larr; Back to menu</a>

<main class="scene">
  <div class="header">
    <img class="brand-logo" src="../../assets/img/NTV_logo_gradient_horz_.png" alt="NTV 360" />
    <span class="rating-chip">
      <svg viewBox="0 0 24 24" fill="#F18029"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      <span><strong>5.0</strong> on Google</span>
    </span>
  </div>

  <div class="hero">
    <div class="tagline">
      <p class="tagline-quote">&ldquo;Absolutely wonderful experience. The service was exceptional and the atmosphere was perfect.&rdquo;</p>
      <span class="tagline-stars">
        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      </span>
      <span class="tagline-name">Sarah Johnson</span>
    </div>

    <div class="arch-col">
      <div class="arch">
        <img src="../../assets/img/person.jpg" alt="Sarah Johnson" />
      </div>
      <span class="pill-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3.2-6.9"></path><path d="M21 6.2V12h-5.6"></path></svg>
        Via Google Business
      </span>
    </div>

    <div class="tagline tagline--right">
      <div class="tagline-contact">
        <span class="contact-item">
          <svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10.5c0 5.5-8 12-8 12s-8-6.5-8-12a8 8 0 1 1 16 0Z"></path><circle cx="12" cy="10.3" r="2.8"></circle></svg>
          123 Main Street, City, State 12345
        </span>
        <span class="contact-item">
          <svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 16.9v2.6a1.8 1.8 0 0 1-2 1.8 17.8 17.8 0 0 1-7.8-2.8 17.5 17.5 0 0 1-5.4-5.4A17.8 17.8 0 0 1 3.5 5.2a1.8 1.8 0 0 1 1.8-2h2.6a1.8 1.8 0 0 1 1.8 1.6c.1 1 .35 2 .7 2.9a1.8 1.8 0 0 1-.4 1.9l-1.1 1.1a14.4 14.4 0 0 0 5.4 5.4l1.1-1.1a1.8 1.8 0 0 1 1.9-.4c.93.35 1.9.6 2.9.7a1.8 1.8 0 0 1 1.6 1.8Z"></path></svg>
          (555) 123-4567
        </span>
        <span class="contact-item">
          <svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18"></path><path d="M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18Z"></path></svg>
          www.yourbusiness.com
        </span>
      </div>
    </div>
  </div>
</main>

<script src="../../assets/js/view-source.js"></script>
</body>
</html>
