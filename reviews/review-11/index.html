<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Review Billboard — Minimal Quote</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --navy: #00263E;
    --ink: #14231C;
    --paper: #F3F6EF;
    --line: #D9E2D2;
    --muted: #56655A;
    --violet: #A00558;
    --red: #EF060F;
    --orange: #F18029;
    --gold: #F5A623;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { overflow: hidden; font-family: 'Inter', Arial, sans-serif; }
  .back-link { position: fixed; top: 16px; left: 16px; z-index: 100; color: var(--ink); opacity: 0.45; text-decoration: none; font-size: 14px; font-weight: 600; }
  .back-link:hover { opacity: 1; }

  @keyframes bb-fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes bb-drift { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(2.5vw, -2vh) scale(1.05); } }
  @keyframes bb-drift-2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-2.2vw, 2.4vh) scale(0.93); } }
  @keyframes bb-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }
  @keyframes bb-shimmer { 0% { background-position: 0% 0; } 100% { background-position: 200% 0; } }

  .scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(135deg, #FBF8F0 0%, #F3F6EF 45%, #F6EBE2 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(28px, 4vh, 48px) clamp(40px, 5vw, 90px);
  }

  .bloom { position: absolute; border-radius: 50%; filter: blur(70px); z-index: 0; }
  .bloom--1 { width: 52vh; height: 52vh; top: -16vh; right: -10vh; background: radial-gradient(circle, rgba(160,5,88,0.22), transparent 70%); animation: bb-drift 17s ease-in-out infinite alternate; }
  .bloom--2 { width: 44vh; height: 44vh; bottom: -14vh; left: -10vh; background: radial-gradient(circle, rgba(241,128,41,0.2), transparent 70%); animation: bb-drift-2 20s ease-in-out infinite alternate; }
  .bloom--3 { width: 30vh; height: 30vh; top: 32vh; left: 6vw; background: radial-gradient(circle, rgba(239,6,15,0.15), transparent 70%); animation: bb-drift 14s ease-in-out infinite alternate-reverse; }
  .bloom--4 { width: 26vh; height: 26vh; bottom: 18vh; right: 12vw; background: radial-gradient(circle, rgba(245,166,35,0.2), transparent 70%); animation: bb-drift-2 12s ease-in-out infinite alternate; }

  .ribbon {
    position: absolute;
    top: -6%;
    right: -20%;
    width: 130%;
    height: 90px;
    background: linear-gradient(90deg, var(--violet), var(--red), var(--orange), var(--gold), var(--violet));
    background-size: 200% 100%;
    animation: bb-shimmer 14s linear infinite;
    transform: rotate(-16deg);
    opacity: 0.1;
    z-index: 0;
  }

  .grid-lines {
    position: absolute;
    inset: 0;
    background-image: linear-gradient(rgba(0,38,62,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0,38,62,0.05) 1px, transparent 1px);
    background-size: 56px 56px;
    z-index: 0;
    mask-image: radial-gradient(65% 65% at 25% 75%, #000 0%, transparent 100%);
  }

  .arcs {
    position: absolute;
    top: clamp(-20vh, -20vh, -12vh);
    right: clamp(-20vh, -20vh, -12vh);
    width: 56vh;
    height: 56vh;
    z-index: 0;
    animation: bb-drift 22s ease-in-out infinite alternate;
  }
  .arcs svg { width: 100%; height: 100%; }

  .arcs-b {
    position: absolute;
    bottom: clamp(-18vh, -18vh, -10vh);
    left: clamp(-14vh, -14vh, -8vh);
    width: 42vh;
    height: 42vh;
    z-index: 0;
    animation: bb-drift-2 18s ease-in-out infinite alternate;
  }
  .arcs-b svg { width: 100%; height: 100%; }

  .field-dots {
    position: absolute;
    background-image: radial-gradient(circle, rgba(0,38,62,0.14) 1.8px, transparent 1.8px);
    background-size: 20px 20px;
    z-index: 0;
  }
  .field-dots--tr { top: clamp(30px, 5vh, 60px); right: clamp(60px, 9vw, 160px); width: clamp(90px, 10vw, 140px); height: clamp(90px, 12vh, 140px); animation: bb-drift 19s ease-in-out infinite alternate; }
  .field-dots--bl { bottom: clamp(40px, 6vh, 70px); left: clamp(50px, 8vw, 140px); width: clamp(80px, 9vw, 120px); height: clamp(80px, 10vh, 120px); animation: bb-drift-2 21s ease-in-out infinite alternate; }

  .accent-dot { position: absolute; border-radius: 50%; z-index: 0; }
  .accent-dot--1 { width: 9px; height: 9px; background: var(--violet); top: 20vh; left: 12vw; opacity: 0.5; animation: bb-drift 10s ease-in-out infinite; }
  .accent-dot--2 { width: 7px; height: 7px; background: var(--orange); bottom: 24vh; right: 16vw; opacity: 0.55; animation: bb-drift-2 12s ease-in-out infinite; }
  .accent-dot--3 { width: 8px; height: 8px; background: var(--gold); top: 14vh; right: 30vw; opacity: 0.5; animation: bb-drift 9s ease-in-out infinite reverse; }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 1000px;
    background: #FFFFFF;
    border-radius: clamp(20px, 2.6vh, 32px);
    box-shadow: 0 40px 90px rgba(0,38,62,0.18), 0 10px 34px rgba(160,5,88,0.1);
    padding: clamp(40px, 5.4vh, 64px) clamp(44px, 5vw, 76px);
    overflow: hidden;
    animation: bb-fadeUp 0.8s ease-out both;
  }

  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: linear-gradient(90deg, var(--violet), var(--red), var(--orange), var(--gold));
    z-index: 2;
  }

  .card-wash {
    position: absolute;
    top: -20%;
    right: -14%;
    width: 60%;
    height: 70%;
    background: radial-gradient(circle, rgba(160,5,88,0.07), transparent 70%);
    z-index: 0;
  }

  .card-dots {
    position: absolute;
    bottom: clamp(20px, 3vh, 34px);
    left: clamp(20px, 3vw, 40px);
    width: clamp(80px, 9vw, 120px);
    height: clamp(70px, 9vh, 110px);
    background-image: radial-gradient(circle, rgba(0,38,62,0.1) 1.6px, transparent 1.6px);
    background-size: 16px 16px;
    z-index: 0;
  }

  .card-watermark {
    position: absolute;
    bottom: 15%;
    right: 2%;
    font-family: 'Manrope', sans-serif;
    font-weight: 800;
    font-size: clamp(160px, 20vw, 300px);
    line-height: 1;
    color: var(--navy);
    opacity: 0.04;
    z-index: 0;
    user-select: none;
  }

  .card-content { position: relative; z-index: 1; }

  .header { display: flex; align-items: center; justify-content: space-between; }

  .brand-logo { height: clamp(20px, 3vh, 30px); width: auto; }

  .g-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(0,38,62,0.06);
    border: 1px solid rgba(0,38,62,0.14);
    border-radius: 999px;
    padding: clamp(5px, 0.8vh, 7px) clamp(16px, 1.6vw, 20px) clamp(5px, 0.8vh, 7px) clamp(5px, 0.8vh, 7px);
  }
  .g-badge-icon {
    width: clamp(24px, 3.2vh, 30px);
    height: clamp(24px, 3.2vh, 30px);
    border-radius: 999px;
    background: #FFFFFF;
    border: 1px solid rgba(0,38,62,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .g-badge-icon svg { width: 60%; height: 60%; }
  .g-badge-label { font-size: clamp(13px, 1.6vh, 15px); font-weight: 600; color: var(--navy); }

  .stars { font-size: clamp(23px, 3.1vh, 31px); letter-spacing: clamp(3px, 0.5vh, 5px); color: var(--gold); }
  .score-chip {
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
    background: linear-gradient(135deg, rgba(160,5,88,0.1), rgba(239,6,15,0.08));
    border: 1px solid rgba(160,5,88,0.25);
    border-radius: 999px;
    padding: clamp(6px, 1vh, 9px) clamp(15px, 1.6vw, 19px);
  }
  .score-num {
    font-family: 'Manrope', sans-serif;
    font-weight: 800;
    font-size: clamp(21px, 2.9vh, 27px);
    background: linear-gradient(135deg, var(--violet), var(--red));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    letter-spacing: -0.4px;
  }
  .score-suffix { font-size: clamp(12px, 1.6vh, 15px); font-weight: 600; color: var(--muted); }

  .quote {
    margin: clamp(26px, 3.6vh, 36px) 0 0;
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    font-size: clamp(30px, 5vh, 48px);
    line-height: 1.32;
    color: var(--navy);
    letter-spacing: -0.5px;
  }

  .reviewer-row { margin-top: clamp(26px, 3.8vh, 38px); display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .reviewer-id { display: flex; align-items: center; gap: 16px; }
  .rating-inline { display: flex; align-items: center; gap: 10px; }

  .avatar {
    width: clamp(48px, 6.2vh, 58px);
    height: clamp(48px, 6.2vh, 58px);
    border-radius: 50%;
    flex-shrink: 0;
    background: linear-gradient(135deg, var(--violet), var(--red));
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Manrope', sans-serif;
    font-weight: 800;
    font-size: clamp(15px, 1.9vh, 19px);
    color: #fff;
  }

  .reviewer-name { font-weight: 700; font-size: clamp(16px, 2.1vh, 21px); color: var(--ink); }
  .reviewer-sub { margin-top: 2px; font-size: clamp(13px, 1.7vh, 16px); font-weight: 500; color: var(--muted); }

  .contact-row {
    display: flex;
    flex-wrap: wrap;
    gap: clamp(10px, 1.4vw, 14px);
    margin-top: clamp(28px, 4vh, 40px);
    padding-top: clamp(24px, 3.4vh, 34px);
    border-top: 1px solid var(--line);
  }
  .contact-pill {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: clamp(7px, 1.1vh, 10px) clamp(16px, 1.8vw, 20px) clamp(7px, 1.1vh, 10px) clamp(7px, 1.1vh, 10px);
  }
  .contact-pill .icon-circle {
    width: clamp(30px, 3.8vh, 36px);
    height: clamp(30px, 3.8vh, 36px);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .contact-pill .icon-circle svg { width: 52%; height: 52%; }
  .contact-pill--address .icon-circle { background: var(--violet); }
  .contact-pill--phone .icon-circle { background: var(--red); }
  .contact-pill--web .icon-circle { background: var(--orange); }
  .contact-pill span { font-size: clamp(14px, 1.8vh, 17px); font-weight: 700; color: var(--navy); }
</style>
</head>
<body>
<a class="back-link" href="../../index.html">&larr; Back to menu</a>
<main class="scene">
  <div class="bloom bloom--1"></div>
  <div class="bloom bloom--2"></div>
  <div class="bloom bloom--3"></div>
  <div class="bloom bloom--4"></div>
  <div class="ribbon"></div>
  <div class="grid-lines"></div>
  <div class="arcs">
    <svg viewBox="0 0 200 200" fill="none">
      <circle cx="200" cy="0" r="190" stroke="#C7D4BE" stroke-width="1.5"/>
      <circle cx="200" cy="0" r="140" stroke="#C7D4BE" stroke-width="1.5"/>
      <circle cx="200" cy="0" r="90" stroke="#A00558" stroke-width="2" opacity="0.35"/>
    </svg>
  </div>
  <div class="arcs-b">
    <svg viewBox="0 0 200 200" fill="none">
      <circle cx="0" cy="200" r="180" stroke="#C7D4BE" stroke-width="1.5"/>
      <circle cx="0" cy="200" r="120" stroke="#00263E" stroke-width="2" opacity="0.2"/>
    </svg>
  </div>
  <div class="field-dots field-dots--tr"></div>
  <div class="field-dots field-dots--bl"></div>
  <div class="accent-dot accent-dot--1"></div>
  <div class="accent-dot accent-dot--2"></div>
  <div class="accent-dot accent-dot--3"></div>

  <div class="card">
    <div class="card-wash"></div>
    <div class="card-dots"></div>
    <div class="card-watermark">&rdquo;</div>
    <div class="card-content">
    <div class="header">
      <div class="g-badge">
        <div class="g-badge-icon">
          <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/></svg>
        </div>
        <div class="g-badge-label">Client Review</div>
      </div>
      <img class="brand-logo" src="../../assets/img/NTV_logo_gradient_horz_.png" alt="NTV 360" />
    </div>

    <p class="quote">&ldquo;Absolutely wonderful experience! The service was exceptional and the atmosphere was perfect. Highly recommend to anyone looking for quality.&rdquo;</p>

    <div class="reviewer-row">
      <div class="reviewer-id">
        <div class="avatar">SJ</div>
        <div>
          <div class="reviewer-name">Sarah Johnson</div>
          <div class="reviewer-sub">Verified Google review</div>
        </div>
      </div>
      <div class="rating-inline">
        <span class="stars">&starf;&starf;&starf;&starf;&starf;</span>
        <span class="score-chip"><span class="score-num">5.0</span><span class="score-suffix">/ 5</span></span>
      </div>
    </div>

    <div class="contact-row">
      <div class="contact-pill contact-pill--address">
        <div class="icon-circle"><svg viewBox="0 0 24 24" fill="#FFFFFF"><path d="M12 2C7.6 2 4 5.6 4 10c0 5.4 8 12 8 12s8-6.6 8-12c0-4.4-3.6-8-8-8Zm0 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6Z"/></svg></div>
        <span>123 Main Street, City, State 12345</span>
      </div>
      <div class="contact-pill contact-pill--phone">
        <div class="icon-circle"><svg viewBox="0 0 24 24" fill="#FFFFFF"><path d="M6.6 10.8c1.4 2.7 3.6 4.9 6.4 6.4l2.1-2.1c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.5.6.5 0 1 .4 1 1V20c0 .5-.5 1-1 1C10.5 21 3 13.5 3 4c0-.5.4-1 1-1h3.5c.6 0 1 .5 1 1 0 1.2.2 2.4.6 3.5.1.3 0 .7-.2 1l-2.3 2.3Z"/></svg></div>
        <span>(555) 123-4567</span>
      </div>
      <div class="contact-pill contact-pill--web">
        <div class="icon-circle"><svg viewBox="0 0 24 24" fill="#FFFFFF"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm7.9 9h-3.2c-.1-2-.6-3.8-1.3-5.3A8 8 0 0 1 19.9 11ZM12 4c.9 1.3 1.6 3.4 1.7 7h-3.4c.1-3.6.8-5.7 1.7-7Zm-2.4.7C8.9 6.2 8.4 8 8.3 10H5.1a8 8 0 0 1 4.5-5.3ZM5.1 13h3.2c.1 2 .6 3.8 1.3 5.3A8 8 0 0 1 5.1 13Zm4.9 6.6c-.9-1.3-1.6-3.4-1.7-7h3.4c-.1 3.6-.8 5.7-1.7 7Zm2.4-.7c.7-1.5 1.2-3.3 1.3-5.3h3.2a8 8 0 0 1-4.5 5.3Z"/></svg></div>
        <span>www.yourbusiness.com</span>
      </div>
    </div>
    </div>
  </div>
</main>
<script src="../../assets/js/view-source.js"></script>
</body>
</html>
