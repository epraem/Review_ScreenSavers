<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Review Billboard — Color Block</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
  .back-link { position: fixed; top: 16px; left: 16px; z-index: 100; color: #fff; opacity: 0.55; text-decoration: none; font-size: 14px; font-weight: 600; }
  .back-link:hover { opacity: 1; }

  @keyframes bb-fadeUp { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }
  @keyframes bb-fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes bb-twinkle { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.75; transform:scale(1.08); } }
  @keyframes bb-slideR { from { opacity:0; transform:translateX(40px); } to { opacity:1; transform:translateX(0); } }

  .scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background:
      radial-gradient(60vw 50vh at 8% 0%, rgba(241,128,41,.08), transparent 60%),
      #071322;
    display: flex;
  }

  .block-violet {
    position: absolute;
    top: 0;
    right: 0;
    width: 27.1vw;
    height: 100%;
    background:
      radial-gradient(120% 90% at 15% 0%, rgba(255,255,255,.1), transparent 55%),
      linear-gradient(165deg, #c21568 0%, #9c0d55 55%, #6e0a3c 100%);
  }
  .block-orange { position: absolute; top: 0; right: 27.1vw; width: 1.35vw; height: 100%; background: linear-gradient(180deg, #F18029, #EF060F); }

  .left {
    position: relative;
    z-index: 2;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 10.2vh 4.7vw 12vh 5.7vw;
    box-sizing: border-box;
  }

  .rating-line { display: flex; align-items: center; gap: clamp(10px, 0.9vw, 18px); animation: bb-fadeIn 0.8s ease-out both; }
  .stars-row { font-size: clamp(15px, 2.2vh, 22px); letter-spacing: clamp(2px, 0.3vh, 4px); color: #F18029; animation: bb-twinkle 2.4s ease-in-out 1s infinite; }
  .rating-label { color: #E8A15C; font-size: clamp(11px, 1.4vh, 15px); font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; }

  .quote-mark { font-family: Georgia, serif; font-size: clamp(36px, 6vh, 64px); line-height: 1; font-weight: 800; color: #F18029; margin-top: clamp(14px, 2.2vh, 26px); animation: bb-fadeIn 0.8s ease-out both; }

  .quote {
    margin-top: clamp(8px, 1.2vh, 14px);
    font-size: clamp(26px, 5vh, 54px);
    line-height: 1.3;
    font-weight: 700;
    color: #AFC9FF;
    text-wrap: pretty;
    animation: bb-fadeUp 1.1s ease-out both;
  }

  .reviewer { margin-top: clamp(28px, 5.2vh, 56px); display: flex; align-items: center; gap: clamp(14px, 2.2vh, 24px); }

  .avatar {
    width: clamp(64px, 9.6vh, 104px);
    height: clamp(64px, 9.6vh, 104px);
    border-radius: 50%;
    overflow: hidden;
    background: #0b3b57;
    border: 3px solid #F18029;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .avatar svg { width: 52%; height: 52%; fill: #CCCCCC; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }

  .name { font-size: clamp(18px, 2.6vh, 28px); font-weight: 700; color: #FDFDFD; }
  .subtext { margin-top: clamp(4px, 0.7vh, 8px); font-size: clamp(11px, 1.4vh, 15px); color: #7FA0C9; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }

  .right {
    position: relative;
    z-index: 3;
    width: 27.1vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(26px, 4.5vh, 50px);
    padding: 5.6vh 2.4vw;
    box-sizing: border-box;
    animation: bb-slideR 0.9s ease-out both;
  }

  .badge {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 0.8vw, 16px);
  }

  .badge-logo { height: clamp(34px, 5.3vh, 58px); width: auto; }

  .photo {
    width: 12.6vw;
    max-width: 220px;
    aspect-ratio: 1;
    border-radius: clamp(14px, 2vh, 22px);
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.22);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .photo svg { width: 42%; height: 42%; fill: rgba(255,255,255,0.6); }
  .photo img { width: 100%; height: 100%; object-fit: cover; }

  .contact {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(16px, 2.6vh, 28px);
    color: #FDFDFD;
    font-size: clamp(20px, 2.7vh, 28px);
    font-weight: 600;
  }

  .contact-line {
    display: inline-flex;
    width: max-content;
    max-width: 100%;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 1vw, 14px);
  }

  .contact-line span { text-align: center; }

  .contact-line svg {
    width: clamp(22px, 3vh, 33px);
    height: clamp(22px, 3vh, 33px);
    flex-shrink: 0;
    fill: #FDFDFD;
    margin-top: 0.15em;
  }
</style>
</head>
<body>
<a class="back-link" href="../../index.html">&larr; Back to menu</a>
<main class="scene">
  <div class="block-violet"></div>
  <div class="block-orange"></div>

  <div class="left">
    <div class="rating-line">
      <div class="stars-row">&starf;&starf;&starf;&starf;&starf;</div>
      <div class="rating-label">5.0 &middot; Google Review Profile</div>
    </div>

    <div class="quote-mark">&ldquo;</div>
    <div class="quote">Absolutely wonderful experience. The service was exceptional and the atmosphere was perfect &mdash; highly recommend to anyone looking for quality.</div>

    <div class="reviewer">
      <div class="avatar">
        <img src="../../assets/img/person1.jpg" alt="Sarah Johnson" />
      </div>
      <div>
        <div class="name">Sarah Johnson</div>
        <div class="subtext">Verified customer</div>
      </div>
    </div>
  </div>

  <div class="right">
    <div class="badge">
      <img class="badge-logo" src="../../assets/img/NTV_logo_white_horz_.png" alt="NTV 360" />
    </div>
    <div class="photo">
      <img src="../../assets/img/person1.jpg" alt="Sarah Johnson" />
    </div>
    <div class="contact">
      <div class="contact-line">
        <svg viewBox="0 0 24 24"><path d="M12 2C7.6 2 4 5.6 4 10c0 5.4 8 12 8 12s8-6.6 8-12c0-4.4-3.6-8-8-8Zm0 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6Z"/></svg>
        <span>123 Main Street, City, State 12345</span>
      </div>
      <div class="contact-line">
        <svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.7 3.6 4.9 6.4 6.4l2.1-2.1c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.5.6.5 0 1 .4 1 1V20c0 .5-.5 1-1 1C10.5 21 3 13.5 3 4c0-.5.4-1 1-1h3.5c.6 0 1 .5 1 1 0 1.2.2 2.4.6 3.5.1.3 0 .7-.2 1l-2.3 2.3Z"/></svg>
        <span>(555) 123-4567</span>
      </div>
      <div class="contact-line">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm7.9 9h-3.2c-.1-2-.6-3.8-1.3-5.3A8 8 0 0 1 19.9 11ZM12 4c.9 1.3 1.6 3.4 1.7 7h-3.4c.1-3.6.8-5.7 1.7-7Zm-2.4.7C8.9 6.2 8.4 8 8.3 10H5.1a8 8 0 0 1 4.5-5.3ZM5.1 13h3.2c.1 2 .6 3.8 1.3 5.3A8 8 0 0 1 5.1 13Zm4.9 6.6c-.9-1.3-1.6-3.4-1.7-7h3.4c-.1 3.6-.8 5.7-1.7 7Zm2.4-.7c.7-1.5 1.2-3.3 1.3-5.3h3.2a8 8 0 0 1-4.5 5.3Z"/></svg>
        <span>www.yourbusiness.com</span>
      </div>
    </div>
  </div>
</main>
<script src="../../assets/js/view-source.js"></script>
</body>
</html>
