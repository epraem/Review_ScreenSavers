<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>NTV360 Review Board</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   NTV360 Review Board · 1920 × 900 signage
   Dark editorial review panel beside a magenta NTV360 contact panel.
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#060B14}
body{display:flex;align-items:center;justify-content:center;
  font-family:Manrope,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.stage{width:1920px;height:900px;flex:none;position:relative;overflow:hidden;transform-origin:center center;background:#0A1220;color:#EAF0FA;display:flex}

a{color:#FF7A3D;text-decoration:none}
a:hover{color:#FFA070}
@keyframes ntv-drift-a{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(180px,-90px,0) scale(1.25)}}
@keyframes ntv-drift-b{0%,100%{transform:translate3d(0,0,0) scale(1.15)}50%{transform:translate3d(-160px,110px,0) scale(.9)}}
@keyframes ntv-drift-c{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(90px,140px,0) scale(1.3)}}
@keyframes ntv-spin{to{transform:rotate(360deg)}}
@keyframes ntv-pulse{0%,100%{opacity:.35}50%{opacity:.9}}
@keyframes ntv-scan{0%{transform:translateY(-100%)}100%{transform:translateY(100%)}}
@keyframes ntv-grid{0%{transform:translateY(0)}100%{transform:translateY(72px)}}

.back-link{position:fixed;top:20px;left:24px;z-index:9999;color:#fff;mix-blend-mode:difference;opacity:.85;text-decoration:none;font-size:15px;font-weight:600;transition:opacity .2s}
.back-link:hover{opacity:1}
</style>
</head>
<body>
<a class="back-link" href="../../index.html">&larr; Back to menu</a>

<div class="stage">

  <div style="flex:1;position:relative;overflow:hidden;min-width:0">
    <div style="position:absolute;inset:-20%;background-image:linear-gradient(rgba(120,160,255,.055) 1px, transparent 1px), linear-gradient(90deg, rgba(120,160,255,.055) 1px, transparent 1px);background-size:72px 72px;animation:ntv-grid 14s linear infinite"></div>
    <div style="position:absolute;top:-180px;left:-120px;width:820px;height:820px;border-radius:50%;background:radial-gradient(circle, rgba(214,0,110,.30) 0%, rgba(214,0,110,0) 62%);filter:blur(18px);animation:ntv-drift-a 22s ease-in-out infinite"></div>
    <div style="position:absolute;bottom:-260px;left:220px;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle, rgba(242,101,34,.22) 0%, rgba(242,101,34,0) 62%);filter:blur(22px);animation:ntv-drift-b 27s ease-in-out infinite"></div>
    <div style="position:absolute;top:120px;right:-200px;width:760px;height:760px;border-radius:50%;background:radial-gradient(circle, rgba(60,120,255,.20) 0%, rgba(60,120,255,0) 62%);filter:blur(20px);animation:ntv-drift-c 31s ease-in-out infinite"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(90deg, rgba(10,18,32,.55) 0%, rgba(10,18,32,.86) 62%, rgba(10,18,32,.96) 100%)"></div>

    <div style="position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;gap:40px;padding:0 110px">

      <div style="display:flex;align-items:center;gap:22px">
        <div style="font-size:30px;letter-spacing:.16em;color:#FF7A3D">★★★★★</div>
        <div style="width:1px;height:26px;background:rgba(234,240,250,.25)"></div>
        <div style="display:flex;align-items:center;gap:12px">
          <div style="width:32px;height:32px;flex:none;border-radius:50%;background:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;color:#4285F4">G</div>
          <div style="font-size:19px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#9FB2CE">5.0 &middot; Google review</div>
        </div>
      </div>

      <div style="display:flex;gap:34px">
        <div style="width:5px;flex:none;border-radius:5px;background:linear-gradient(180deg, #FF7A3D, #D6006E);animation:ntv-pulse 5s ease-in-out infinite"></div>
        <div style="font-size:60px;font-weight:700;line-height:1.24;letter-spacing:-.02em;color:#FFFFFF;max-width:1180px">Absolutely wonderful experience. The service was exceptional and the atmosphere was perfect, highly recommend to anyone looking for quality.</div>
      </div>

      <div style="display:flex;align-items:center;gap:22px;padding-top:14px">
        <div style="width:88px;height:88px;flex:none;border-radius:50%;padding:3px;background:linear-gradient(140deg, #FF7A3D, #D6006E)">
          <div style="width:100%;height:100%;border-radius:50%;overflow:hidden;background:#0A1220">
            <img src="../../assets/img/person1.jpg" alt="Sarah Johnson" style="width:100%;height:100%;object-fit:cover;display:block">
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px">
          <div style="font-size:32px;font-weight:700">Sarah Johnson</div>
          <div style="font-size:17px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#7FA0FF">Verified customer</div>
        </div>
      </div>
    </div>
  </div>

  <div style="width:8px;flex:none;background:linear-gradient(180deg, #FF9A3D, #F2400F)"></div>

  <div style="width:600px;flex:none;position:relative;overflow:hidden;background:linear-gradient(155deg, #D6006E 0%, #A50B5E 55%, #6E0A47 100%)">
    <div style="position:absolute;top:-40%;left:-40%;width:180%;height:180%;background:conic-gradient(from 0deg, rgba(255,255,255,0) 0deg, rgba(255,255,255,.16) 60deg, rgba(255,255,255,0) 140deg, rgba(255,255,255,.10) 240deg, rgba(255,255,255,0) 360deg);animation:ntv-spin 26s linear infinite"></div>
    <div style="position:absolute;left:0;top:0;width:100%;height:36%;background:linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,0));animation:ntv-scan 9s linear infinite"></div>
    <div style="position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.14) 1.4px, transparent 1.4px);background-size:34px 34px;opacity:.5"></div>

    <div style="position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;padding:0 56px;color:#FFFFFF">

      <div style="display:flex;align-items:baseline;gap:6px">
        <div style="font-size:74px;font-weight:800;letter-spacing:-.03em;line-height:1">NTV</div>
        <div style="font-size:34px;font-weight:500;letter-spacing:-.01em">360</div>
      </div>

      <div style="width:236px;height:236px;flex:none;border-radius:26px;overflow:hidden;background:rgba(255,255,255,.14);box-shadow:0 26px 60px rgba(40,0,25,.4)">
        <img src="../../assets/img/person1.jpg" alt="Sarah Johnson" style="width:100%;height:100%;object-fit:cover;display:block">
      </div>

      <div style="display:flex;flex-direction:column;gap:22px;width:100%">
        <div style="display:flex;align-items:flex-start;gap:16px">
          <svg width="22" height="28" viewBox="0 0 20 26" fill="none" style="flex:none;margin-top:4px"><path d="M10 0a8 8 0 0 0-8 8c0 6 8 18 8 18s8-12 8-18a8 8 0 0 0-8-8zm0 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6z" fill="#FFFFFF"></path></svg>
          <div style="font-size:27px;font-weight:600;line-height:1.35;white-space:nowrap">123 Main Street<br>City, State 12345</div>
        </div>
        <div style="height:1px;background:rgba(255,255,255,.28)"></div>
        <div style="display:flex;align-items:center;gap:16px">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" style="flex:none"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.3.2 2.5.57 3.6a1 1 0 0 1-.25 1l-2.2 2.2z" fill="#FFFFFF"></path></svg>
          <div style="font-size:29px;font-weight:600;white-space:nowrap">(555) 123-4567</div>
        </div>
        <div style="height:1px;background:rgba(255,255,255,.28)"></div>
        <div style="display:flex;align-items:center;gap:16px">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" style="flex:none"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 2c1.3 0 2.6 2.2 3 5H9c.4-2.8 1.7-5 3-5zM4.3 11h3.4c.1-2 .5-3.8 1.2-5.2A8 8 0 0 0 4.3 11zm0 2a8 8 0 0 0 4.6 5.2c-.7-1.4-1.1-3.2-1.2-5.2H4.3zm5.4 0h4.6c-.4 2.8-1.7 5-3 5s-2.2-2.2-3-5zm6.6 0h3.4a8 8 0 0 1-4.6 5.2c.7-1.4 1.1-3.2 1.2-5.2zm0-2c-.1-2-.5-3.8-1.2-5.2A8 8 0 0 1 19.7 11h-3.4z" fill="#FFFFFF"></path></svg>
          <div style="font-size:29px;font-weight:700;white-space:nowrap">www.yourbusiness.com</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var s=document.querySelector('.stage');
  function fit(){s.style.transform='scale('+Math.min(innerWidth/1920,innerHeight/900)+')';}
  addEventListener('resize',fit);fit();
})();
</script>

<script src="../../assets/js/view-source.js"></script>
<script src="../../assets/js/deck-nav.js"></script>
</body>
</html>
