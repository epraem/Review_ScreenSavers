<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Vantage Auto Works — Reviews Board</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   Vantage Reviews Board · 1920 × 1080 signage
   Coverflow review carousel over a bold blue backdrop, contact bar below.
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0033CC}
body{display:flex;align-items:center;justify-content:center;
  font-family:'DM Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.stage{width:1920px;height:1080px;flex:none;position:relative;overflow:hidden;transform-origin:center center;background:#0033CC;color:#FFFFFF;display:flex;flex-direction:column}

a{color:#0033CC;text-decoration:none}
a:hover{color:#002499}
@keyframes vg-rails{0%{transform:translateX(0)}100%{transform:translateX(160px)}}
@keyframes vg-blink{0%,100%{opacity:.3}50%{opacity:1}}

.back-link{position:fixed;top:20px;left:24px;z-index:9999;color:#fff;mix-blend-mode:difference;opacity:.85;text-decoration:none;font-size:15px;font-weight:600;transition:opacity .2s}
.back-link:hover{opacity:1}

.card{position:absolute;top:50%;left:50%;box-sizing:border-box;width:860px;margin-left:-430px;margin-top:-278px;height:556px;background:#FFFFFF;color:#08122E;padding:56px 60px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 40px 90px rgba(0,14,60,.36);transition:transform 1.2s cubic-bezier(.22,1,.36,1), opacity 1.2s cubic-bezier(.22,1,.36,1), filter 1.2s cubic-bezier(.22,1,.36,1)}
/* Slide indicator: a track per review. The active one fills across the hold
   time, so the board shows how long the current review stays up. */
.bar{height:4px;width:56px;background:rgba(255,255,255,.28);overflow:hidden}
.bar span{display:block;height:100%;background:#FFFFFF;transform:scaleX(0);transform-origin:left center}
</style>
</head>
<body>
<a class="back-link" href="../../index.html">&larr; Back to menu</a>

<div class="stage">

  <div style="position:absolute;inset:-10%;background-image:repeating-linear-gradient(115deg, rgba(255,255,255,.05) 0 2px, rgba(255,255,255,0) 2px 160px);animation:vg-rails 9s linear infinite"></div>
  <div style="position:absolute;inset:0;background:radial-gradient(1100px 800px at 50% 44%, rgba(255,255,255,.10) 0%, rgba(0,51,204,0) 70%)"></div>

  <div style="position:relative;flex:none;display:flex;align-items:center;justify-content:space-between;padding:52px 88px 0">
    <div style="display:flex;align-items:center;gap:20px">
      <div style="width:58px;height:58px;flex:none;background:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;color:#0033CC">V</div>
      <div style="display:flex;flex-direction:column;gap:5px">
        <div style="font-size:36px;font-weight:800;letter-spacing:-.01em">VANTAGE AUTO WORKS</div>
        <div style="font-family:'DM Sans', sans-serif;font-size:17px;letter-spacing:.26em;text-transform:uppercase;color:#B9CBFF">Service &middot; Diagnostics &middot; Collision</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:18px;padding:14px 26px;border:2px solid rgba(255,255,255,.4)">
      <div style="width:34px;height:34px;flex:none;border-radius:50%;background:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#4285F4">G</div>
      <div style="font-size:26px;font-weight:700">4.9</div>
      <div style="font-size:20px;color:#FFD44A;letter-spacing:.1em">★★★★★</div>
      <div style="font-family:'DM Sans', sans-serif;font-size:16px;letter-spacing:.2em;text-transform:uppercase;color:#B9CBFF">512 Google reviews</div>
    </div>
  </div>

  <div style="position:relative;flex:1;min-height:0" id="cardWrap"></div>

  <div style="position:relative;flex:none;display:flex;flex-direction:column">
    <div style="display:flex;gap:10px;justify-content:center;padding:0 88px 30px" id="barWrap"></div>

    <div style="display:grid;grid-template-columns:1.5fr 1fr 1.35fr;background:#FFFFFF;color:#08122E">
      <div style="display:flex;align-items:center;gap:22px;padding:38px 48px 40px 88px">
        <svg width="30" height="39" viewBox="0 0 20 26" fill="none" style="flex:none"><path d="M10 0a8 8 0 0 0-8 8c0 6 8 18 8 18s8-12 8-18a8 8 0 0 0-8-8zm0 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6z" fill="#0033CC"></path></svg>
        <div style="display:flex;flex-direction:column;gap:9px;min-width:0">
          <div style="font-family:'DM Sans', sans-serif;font-size:16px;letter-spacing:.28em;text-transform:uppercase;color:#5A6785">Visit the shop</div>
          <div style="font-size:38px;font-weight:700;line-height:1.16;letter-spacing:-.015em;white-space:nowrap">2740 Industrial Parkway<br>Columbus, OH 43204</div>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:22px;padding:38px 48px 40px;border-left:3px solid #E7EBF5">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" style="flex:none"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.3.2 2.5.57 3.6a1 1 0 0 1-.25 1l-2.2 2.2z" fill="#0033CC"></path></svg>
        <div style="display:flex;flex-direction:column;gap:9px;min-width:0">
          <div style="font-family:'DM Sans', sans-serif;font-size:16px;letter-spacing:.28em;text-transform:uppercase;color:#5A6785">Call or text</div>
          <div style="font-size:44px;font-weight:700;line-height:1.05;letter-spacing:-.02em;white-space:nowrap">(614) 555-0132</div>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:22px;padding:38px 88px 40px 48px;background:#0033CC;color:#FFFFFF">
        <div style="width:14px;height:14px;flex:none;background:#FFD44A;animation:vg-blink 2.6s ease-in-out infinite"></div>
        <div style="display:flex;flex-direction:column;gap:9px;min-width:0">
          <div style="font-family:'DM Sans', sans-serif;font-size:16px;letter-spacing:.28em;text-transform:uppercase;color:#B9CBFF">Book online</div>
          <div style="font-size:52px;font-weight:800;line-height:1.05;letter-spacing:-.03em;white-space:nowrap">vantageautoworks.com</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var s=document.querySelector('.stage');
  function fit(){s.style.transform='scale('+Math.min(innerWidth/1920,innerHeight/1080)+')';}
  addEventListener('resize',fit);fit();

  var REVIEWS=[
    {name:"Dana Whitfield",meta:"Local Guide · 1 week ago",rating:5,quote:"Diagnosed an electrical fault two other shops missed, fixed it same day, and charged less than the quote."},
    {name:"Marcus Lu",meta:"Columbus · 3 weeks ago",rating:5,quote:"They texted me photos of every part they replaced. First shop I've trusted completely in twenty years of driving."},
    {name:"Alina Sokolov",meta:"Grandview · 1 month ago",rating:5,quote:"Collision work came back invisible. You cannot tell the panel was ever touched, and they handled the insurance calls."},
    {name:"Reggie Nkemdi",meta:"Local Guide · 2 months ago",rating:5,quote:"Booked online at midnight, dropped the car at seven, drove it home by four. No runaround, no upsell."},
    {name:"Casey Brennan",meta:"Hilliard · 2 months ago",rating:4,quote:"Honest estimate and clean work. The waiting room is small, so plan on the loaner if you have somewhere to be."}
  ];
  var n=REVIEWS.length;
  var holdSeconds=11;
  var i=0;

  var cardWrap=document.getElementById('cardWrap');
  var barWrap=document.getElementById('barWrap');

  var cardEls=REVIEWS.map(function(r){
    var el=document.createElement('div');
    el.className='card';
    el.innerHTML =
      '<div style="display:flex;align-items:center;justify-content:space-between">'+
        '<div class="stars" style="font-size:30px;color:#FFB000;letter-spacing:.14em"></div>'+
        '<div style="display:flex;align-items:center;gap:10px">'+
          '<div style="width:30px;height:30px;flex:none;border-radius:50%;border:1.5px solid #DDE3F0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#4285F4">G</div>'+
          '<div style="font-family:\'DM Sans\', sans-serif;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:#5A6785">Google</div>'+
        '</div>'+
      '</div>'+
      '<div class="quote" style="font-size:44px;font-weight:600;line-height:1.32;letter-spacing:-.015em"></div>'+
      '<div style="display:flex;align-items:center;gap:20px;border-top:2px solid #E7EBF5;padding-top:26px">'+
        '<div class="initial" style="width:64px;height:64px;flex:none;background:#0033CC;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700"></div>'+
        '<div style="display:flex;flex-direction:column;gap:4px">'+
          '<div class="name" style="font-size:27px;font-weight:700"></div>'+
          '<div class="meta" style="font-family:\'DM Sans\', sans-serif;font-size:17px;color:#5A6785"></div>'+
        '</div>'+
      '</div>';
    el.querySelector('.stars').textContent='★★★★★☆☆☆☆☆'.slice(5-r.rating,10-r.rating);
    el.querySelector('.quote').textContent='“'+r.quote+'”';
    el.querySelector('.initial').textContent=r.name.charAt(0);
    el.querySelector('.name').textContent=r.name;
    el.querySelector('.meta').textContent=r.meta;
    cardWrap.appendChild(el);
    return el;
  });

  var reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;

  var barFills=REVIEWS.map(function(){
    var b=document.createElement('div');
    b.className='bar';
    var fill=document.createElement('span');
    b.appendChild(fill);
    barWrap.appendChild(b);
    return fill;
  });

  function render(){
    cardEls.forEach(function(el,k){
      var off=(k-i+n)%n;
      if(off>n/2) off-=n;
      var abs=Math.abs(off);
      var x=off*740;
      var scale=abs===0?1:0.82;
      el.style.transform='translateX('+x+'px) scale('+scale+')';
      el.style.opacity=abs===0?1:abs===1?0.55:0;
      el.style.filter=abs===0?'blur(0px)':'blur(5px)';
      el.style.zIndex=abs===0?3:abs===1?2:1;
    });
    // Reviews already shown read as full, upcoming ones empty, and the current
    // one runs from empty to full over the hold time.
    barFills.forEach(function(fill,k){
      fill.style.transition='none';
      fill.style.transform='scaleX(' + (k < i ? 1 : 0) + ')';
      if(k!==i) return;
      if(reduceMotion){fill.style.transform='scaleX(1)';return;}
      void fill.offsetWidth; // commit the reset so the fill restarts each slide
      fill.style.transition='transform '+holdSeconds+'s linear';
      fill.style.transform='scaleX(1)';
    });
  }
  render();

  setInterval(function(){
    i=(i+1)%n;
    render();
  },holdSeconds*1000);
})();
</script>

<script src="../../assets/js/view-source.js"></script>
<script src="../../assets/js/deck-nav.js"></script>
</body>
</html>
