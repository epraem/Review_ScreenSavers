/* ============================================================
   V1-A · REVIEW HERO · "Aurora"  ·  1920 × 1080 signage slide
   EDIT BUSINESS DETAILS IN THE HTML BELOW (search: EDIT:)
   ============================================================ */
:root{
  --ink:#ffffff;
  --muted:rgba(255,255,255,.62);
  --gold:#ffc043;
  --accent:#5b8cff;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#04070f}
body{display:flex;align-items:center;justify-content:center;
  font-family:'Plus Jakarta Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.stage{width:1920px;height:1080px;position:relative;overflow:hidden;flex:0 0 auto;
  transform-origin:center center;color:var(--ink);
  background:
    radial-gradient(1200px 780px at 22% 8%, #1d3f8f 0%, rgba(29,63,143,0) 62%),
    radial-gradient(1000px 700px at 88% 92%, #6b2fa8 0%, rgba(107,47,168,0) 60%),
    radial-gradient(900px 600px at 78% 4%, #0d6fb8 0%, rgba(13,111,184,0) 58%),
    linear-gradient(160deg,#061027 0%,#040a1c 55%,#070418 100%)}

/* soft moving aurora */
.aurora{position:absolute;inset:-20%;filter:blur(90px);opacity:.55;pointer-events:none}
.aurora i{position:absolute;display:block;border-radius:50%}
.a1{width:820px;height:820px;left:6%;top:2%;background:#2b6ef5;animation:drift 26s ease-in-out infinite}
.a2{width:700px;height:700px;right:4%;bottom:0%;background:#8b3ff0;animation:drift 32s ease-in-out infinite reverse}
.a3{width:520px;height:520px;left:46%;top:56%;background:#0ea5c9;animation:drift 22s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(60px,-50px,0) scale(1.12)}}

/* star dust */
.dust{position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:
    radial-gradient(1.6px 1.6px at 12% 22%, #fff, transparent),
    radial-gradient(1.4px 1.4px at 68% 12%, #fff, transparent),
    radial-gradient(1.2px 1.2px at 82% 44%, #cfe0ff, transparent),
    radial-gradient(1.6px 1.6px at 30% 72%, #fff, transparent),
    radial-gradient(1.2px 1.2px at 55% 88%, #cfe0ff, transparent),
    radial-gradient(1.4px 1.4px at 92% 78%, #fff, transparent),
    radial-gradient(1.2px 1.2px at 6% 58%, #fff, transparent);
  animation:twinkle 6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.35}50%{opacity:.7}}

.wrap{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;
  padding:56px 130px 104px}
.core{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center}

/* logo */
.logo{display:flex;align-items:center;gap:16px;padding:16px 30px;border-radius:16px;
  background:#fff;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.logo svg{width:44px;height:44px;display:block}
.logo span{font-size:30px;font-weight:800;letter-spacing:.02em;color:#0f1a33}

/* avatar */
.avatar{margin-top:0;width:132px;height:132px;border-radius:50%;position:relative;
  background:linear-gradient(145deg,#5b8cff,#a855f7);padding:4px;
  box-shadow:0 0 0 10px rgba(91,140,255,.14),0 22px 60px rgba(0,0,0,.5)}
.avatar div{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(150deg,#12244d,#241a4d);font-size:46px;font-weight:700;letter-spacing:.04em;color:#e8f0ff}

/* quote */
.quotemark{margin-top:38px;font-size:74px;line-height:.6;color:rgba(255,255,255,.18);font-weight:800}
.quote{margin-top:18px;max-width:1500px;text-align:center;font-size:62px;line-height:1.34;
  font-weight:600;letter-spacing:-.012em;text-wrap:balance;
  text-shadow:0 4px 30px rgba(0,0,0,.35)}

/* attribution */
.attr{margin-top:46px;display:flex;align-items:center;gap:30px}
.gbadge{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.94);
  padding:12px 22px 12px 16px;border-radius:999px;box-shadow:0 12px 34px rgba(0,0,0,.35)}
.gbadge svg{width:34px;height:34px}
.gbadge b{font-size:20px;font-weight:700;color:#3c4043;letter-spacing:.01em}
.gbadge b em{font-style:normal;color:#5f6368;font-weight:600;display:block;font-size:14px;margin-top:-2px}
.who{display:flex;flex-direction:column;gap:8px}
.stars{display:flex;gap:7px}
.stars svg{width:38px;height:38px;fill:var(--gold);filter:drop-shadow(0 3px 8px rgba(255,192,67,.4))}
.name{font-size:32px;font-weight:600;letter-spacing:.005em}

/* footer */
.footer{position:absolute;left:0;right:0;bottom:0;height:104px;display:flex;align-items:center;
  justify-content:space-between;padding:0 80px;
  background:linear-gradient(0deg,rgba(2,5,14,.85),rgba(2,5,14,0));
  border-top:1px solid rgba(255,255,255,.08)}
.f{display:flex;align-items:center;gap:14px;font-size:26px;font-weight:500;color:rgba(255,255,255,.88)}
.f svg{width:28px;height:28px;flex:0 0 auto}
.back-link{position:fixed;top:20px;left:24px;z-index:9999;color:#fff;mix-blend-mode:difference;opacity:.85;text-decoration:none;font-size:15px;font-weight:600;font-family:'Plus Jakarta Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;transition:opacity .2s}
.back-link:hover{opacity:1}
</style>

<script>
(function(){
  var s=document.querySelector('.stage');
  function fit(){s.style.transform='scale('+Math.min(innerWidth/1920,innerHeight/1080)+')';}
  addEventListener('resize',fit);fit();

  /* Auto-shrink long text so it never overflows the slide */
  function fitW(el){var f=parseFloat(getComputedStyle(el).fontSize),g=140;
    while(el.scrollWidth>el.clientWidth+1&&f>16&&g--){f-=2;el.style.fontSize=f+'px';}}
  function fitH(el,max){var f=parseFloat(getComputedStyle(el).fontSize),g=140;
    while(el.scrollHeight>max&&f>16&&g--){f-=2;el.style.fontSize=f+'px';}}
  function run(){
    document.querySelectorAll('[data-fit]').forEach(fitW);
    document.querySelectorAll('[data-fitv]').forEach(function(el){fitH(el,parseFloat(el.dataset.fitv));});
  }
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(run);}
  setTimeout(run,1200);run();
})();
</script>
