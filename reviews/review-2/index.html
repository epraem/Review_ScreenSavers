<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Review Billboard — Client Testimonial</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
  .back-link { position: fixed; top: 16px; left: 16px; z-index: 100; color: #fff; opacity: 0.6; text-decoration: none; font-size: 14px; font-weight: 600; }
  .back-link:hover { opacity: 1; }

  @keyframes bb-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2.2vh); } }
  @keyframes bb-float2 { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(1.8vh) rotate(3deg); } }
  @keyframes bb-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes bb-pulse { 0%,100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.06); opacity: 1; } }

  .scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #00263E;
  }

  .blob1 {
    position: absolute;
    top: -11vh;
    left: -4.2vw;
    width: 27.1vw;
    height: 24.1vh;
    border-radius: 0 12vh 12vh 0;
    background: rgba(255, 255, 255, 0.15);
    animation: bb-float 7s ease-in-out infinite;
  }

  .blob2 {
    position: absolute;
    top: 56.5vh;
    left: -6.25vw;
    width: 31.25vw;
    height: 20.4vh;
    border-radius: 0 10.2vh 10.2vh 0;
    background: linear-gradient(45deg, #A00558 0%, #EF060F 50%, #F18029 100%);
    animation: bb-float2 9s ease-in-out infinite;
  }

  .blob3 {
    position: absolute;
    bottom: -13vh;
    right: -5.2vw;
    width: 29.2vw;
    height: 38.9vh;
    border-radius: 11.1vh 0 0 0;
    background: rgba(255, 255, 255, 0.15);
    animation: bb-pulse 6s ease-in-out infinite;
  }

  .ring1 {
    position: absolute;
    top: 6.5vh;
    right: 6.25vw;
    width: 24.1vh;
    height: 24.1vh;
    border-radius: 50%;
    background: repeating-radial-gradient(circle, rgba(255,255,255,0.3) 0px, rgba(255,255,255,0.3) 3px, transparent 4px, transparent 20px);
    animation: bb-spin 40s linear infinite;
  }

  .ring2 {
    position: absolute;
    bottom: 11.1vh;
    left: 3.6vw;
    width: 20.4vh;
    height: 20.4vh;
    border-radius: 50%;
    background: repeating-radial-gradient(circle, rgba(241,128,41,0.55) 0px, rgba(241,128,41,0.55) 3px, transparent 4px, transparent 18px);
    animation: bb-spin 30s linear infinite reverse;
  }

  .script {
    position: absolute;
    top: 5.1vh;
    left: 7.8vw;
    font-family: Georgia, serif;
    font-style: italic;
    font-size: clamp(26px, 5.2vh, 56px);
    color: #F18029;
    z-index: 2;
  }

  .headline {
    position: absolute;
    top: 10.7vh;
    left: 7.8vw;
    font-size: clamp(36px, 7vh, 76px);
    font-weight: 800;
    color: #FDFDFD;
    z-index: 2;
    letter-spacing: -1px;
  }

  .brand-logo {
    position: absolute;
    top: 4.4vh;
    right: 3.6vw;
    z-index: 3;
    height: clamp(28px, 4.4vh, 48px);
    width: auto;
    filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.3));
  }

  .card {
    position: absolute;
    top: 17.5vh;
    left: 27vw;
    width: 68vw;
    background: #FDFDFD;
    border: 1px solid #CCCCCC;
    border-radius: clamp(16px, 3vh, 32px);
    padding: clamp(26px, 4.7vh, 50px) clamp(36px, 4.1vw, 80px) clamp(52px, 9.2vh, 98px);
    box-sizing: border-box;
    box-shadow: 0 30px 70px rgba(0, 38, 62, 0.18);
    z-index: 3;
  }

  .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .card-quote-mark { font-size: clamp(50px, 9.5vh, 104px); line-height: 0.6; font-weight: 900; color: #A00558; font-family: Georgia, serif; }
  .stars { font-size: clamp(20px, 3.6vh, 39px); letter-spacing: clamp(3px, 0.64vh, 7px); color: #F18029; }
  .quote-text { margin-top: clamp(4px, 0.7vh, 7px); font-size: clamp(28px, 4.8vh, 52px); line-height: 1.4; font-weight: 600; color: #231F20; text-wrap: pretty; }

  .card-quote-mark-close {
    position: absolute;
    bottom: clamp(8px, 1.2vh, 12px);
    right: clamp(28px, 3.2vw, 62px);
    font-size: clamp(50px, 9.5vh, 104px);
    line-height: 0.6;
    font-weight: 900;
    color: #A00558;
    font-family: Georgia, serif;
  }

  .name-bar {
    position: absolute;
    top: 74.1vh;
    left: 7.8vw;
    width: 46.9vw;
    background: linear-gradient(45deg, #A00558 0%, #EF060F 50%, #F18029 100%);
    border-radius: 0 clamp(20px, 3.7vh, 40px) clamp(20px, 3.7vh, 40px) clamp(20px, 3.7vh, 40px);
    padding: clamp(16px, 2.8vh, 30px) clamp(28px, 3.1vw, 60px);
    display: flex;
    align-items: center;
    gap: clamp(16px, 3vh, 32px);
    box-sizing: border-box;
    z-index: 4;
  }

  .photo {
    width: clamp(56px, 9.3vh, 100px);
    height: clamp(56px, 9.3vh, 100px);
    border-radius: 50%;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.2);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .photo svg { width: 56%; height: 56%; fill: rgba(255, 255, 255, 0.75); }

  .reviewer-name { font-size: clamp(18px, 3vh, 32px); font-weight: 800; color: #FDFDFD; }
  .reviewer-sub { margin-top: clamp(3px, 0.6vh, 6px); font-size: clamp(13px, 2vh, 22px); color: rgba(255, 255, 255, 0.8); font-weight: 600; }

  .contact-row {
    position: absolute;
    bottom: 2.8vh;
    left: 7.8vw;
    right: 3.6vw;
    display: flex;
    align-items: center;
    gap: clamp(24px, 3vw, 56px);
    z-index: 2;
  }

  .contact-item {
    display: flex;
    align-items: center;
    gap: clamp(8px, 1vw, 14px);
    font-size: clamp(14px, 2.2vh, 24px);
    font-weight: 700;
    color: #FDFDFD;
  }

  .contact-item svg { width: clamp(16px, 2.4vh, 24px); height: clamp(16px, 2.4vh, 24px); flex-shrink: 0; }
</style>
</head>
<body>
<a class="back-link" href="../../index.html">&larr; Back to menu</a>
<main class="scene">
  <div class="blob1"></div>
  <div class="blob2"></div>
  <div class="blob3"></div>
  <div class="ring1"></div>
  <div class="ring2"></div>
  <img class="brand-logo" src="../../assets/img/NTV_logo_gradient_horz_.png" alt="NTV 360" />

  <div class="script">Client</div>
  <div class="headline">Reviews</div>

  <div class="card">
    <div class="card-top">
      <div class="card-quote-mark">&ldquo;</div>
      <div class="stars">&starf;&starf;&starf;&starf;&starf;</div>
    </div>
    <div class="quote-text">Absolutely wonderful experience! The service was exceptional and the atmosphere was perfect. Highly recommend to anyone looking for quality.</div>
    <div class="card-quote-mark-close">&rdquo;</div>
  </div>

  <div class="name-bar">
    <div class="photo">
      <svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.4 0-8 2.2-8 5v3h16v-3c0-2.8-3.6-5-8-5Z"/></svg>
    </div>
    <div>
      <div class="reviewer-name">Sarah Johnson</div>
      <div class="reviewer-sub">Verified Google review</div>
    </div>
  </div>

  <div class="contact-row">
    <div class="contact-item">
      <svg viewBox="0 0 24 24" fill="#FDFDFD"><path d="M12 2C7.6 2 4 5.6 4 10c0 5.4 8 12 8 12s8-6.6 8-12c0-4.4-3.6-8-8-8Zm0 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6Z"/></svg>
      123 Main Street, City, State 12345
    </div>
    <div class="contact-item">
      <svg viewBox="0 0 24 24" fill="#FDFDFD"><path d="M6.6 10.8c1.4 2.7 3.6 4.9 6.4 6.4l2.1-2.1c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.5.6.5 0 1 .4 1 1V20c0 .5-.5 1-1 1C10.5 21 3 13.5 3 4c0-.5.4-1 1-1h3.5c.6 0 1 .5 1 1 0 1.2.2 2.4.6 3.5.1.3 0 .7-.2 1l-2.3 2.3Z"/></svg>
      (555) 123-4567
    </div>
    <div class="contact-item">
      <svg viewBox="0 0 24 24" fill="#FDFDFD"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm7.9 9h-3.2c-.1-2-.6-3.8-1.3-5.3A8 8 0 0 1 19.9 11ZM12 4c.9 1.3 1.6 3.4 1.7 7h-3.4c.1-3.6.8-5.7 1.7-7Zm-2.4.7C8.9 6.2 8.4 8 8.3 10H5.1a8 8 0 0 1 4.5-5.3ZM5.1 13h3.2c.1 2 .6 3.8 1.3 5.3A8 8 0 0 1 5.1 13Zm4.9 6.6c-.9-1.3-1.6-3.4-1.7-7h3.4c-.1 3.6-.8 5.7-1.7 7Zm2.4-.7c.7-1.5 1.2-3.3 1.3-5.3h3.2a8 8 0 0 1-4.5 5.3Z"/></svg>
      www.yourbusiness.com
    </div>
  </div>
</main>
<script src="../../assets/js/view-source.js"></script>
</body>
</html>
